services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tripifi
      POSTGRES_PASSWORD: tripifi
      POSTGRES_DB: tripifi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://tripifi:tripifi@postgres:5432/tripifi
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  pgdata:

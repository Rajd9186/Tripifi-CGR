services:
  - type: web
    name: tripifi-cgr
    env: node
    region: oregon
    plan: free
    branch: main
    buildCommand: npm ci && npx --no-install next build
    startCommand: npx --no-install next start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # Live backend. Unset = demo/local data mode.
      - key: NEXT_PUBLIC_API_URL
        value: https://tripifi-cgr-1.onrender.com/api/v1

  # Tripifi FastAPI backend: AI (Groq/NVIDIA/Ollama), search, enquiries.
  # No database attached: AI + demo-mode endpoints work standalone;
  # attach a DATABASE_URL later for DB-backed endpoints (auth/bookings).
  - type: web
    name: tripifi-api
    env: docker
    region: oregon
    plan: free
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AI_PROVIDER
        value: ollama
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_CLOUD_MODEL
        value: gemma4:31b
      - key: FLIGHT_PROVIDER
        value: serpapi,aviationstack
      - key: TRAIN_PROVIDER
        value: disabled
      - key: HOTEL_PROVIDER
        value: overpass
      - key: SERPAPI_API_KEY
        sync: false
      - key: SERPAPI_MONTHLY_QUOTA
        value: 100
      - key: GROQ_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: NVIDIA_MODEL
        value: meta/llama-3.3-70b-instruct
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434
      - key: CORS_ORIGINS
        value: https://tripifi-cgr.onrender.com,http://localhost:3000
      - key: FRONTEND_URL
        value: https://tripifi-cgr.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true

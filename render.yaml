services:
  - type: web
    name: tripifi-cgr
    env: node
    region: oregon
    plan: free
    branch: main
    buildCommand: npm ci && npx --no-install next build
    startCommand: npx --no-install next start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # Point at the deployed FastAPI backend when available, e.g.
      # https://tripifi-api.onrender.com/api/v1 — unset = demo/local data mode.
      - key: NEXT_PUBLIC_API_URL
        sync: false
